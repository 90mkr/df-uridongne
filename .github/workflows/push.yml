name: 알림 보내기
# 본부 방만 고침. 15분마다 새 글·새 댓글을 보고 게시판 알림을 보낸다 (FIREBASE_SA 비밀이 있어야 동작).
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
concurrency: { group: push, cancel-in-progress: false }
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
    steps:
      - uses: actions/checkout@v4
        if: env.FIREBASE_SA != ''
      - uses: actions/cache/restore@v4
        if: env.FIREBASE_SA != ''
        with: { path: /tmp/push_state, key: push-state-${{ github.run_id }}, restore-keys: push-state- }
      - name: 보내기
        if: env.FIREBASE_SA != ''
        run: pip install -q google-auth requests && python3 collector/push_send.py
      - uses: actions/cache/save@v4
        if: env.FIREBASE_SA != ''
        with: { path: /tmp/push_state, key: push-state-${{ github.run_id }} }
