name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 collector/probe.py
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          VWORLD_KEY: ${{ secrets.VWORLD_KEY }}
          SIDS: PW014293,CPCP0005,LU001801
