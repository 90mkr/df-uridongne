<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>우편번호 찾기 – 우리동네</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #fff; font-family: Pretendard, sans-serif; color: #1a1d23; }
  .top { padding: 16px 20px 12px; border-bottom: 1px solid #eceef2; }
  .top b { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
  .top span { display: block; margin-top: 3px; font-size: 12.5px; color: #8a909a; }
  #wrap { height: calc(100% - 64px); }
  #res { display: none; padding: 22px 20px; }
  .zip { font-size: 13px; color: #8a909a; }
  .zip strong { display: block; margin-top: 4px; font-size: 34px; font-weight: 300; color: #1f5eff; letter-spacing: 1px; }
  .addr { margin-top: 18px; padding: 14px 16px; border: 1px solid #e3e6eb; border-radius: 10px; box-shadow: 0 2px 10px rgba(20, 30, 50, .05); }
  .addr div { font-size: 12px; color: #8a909a; }
  .addr p { margin: 3px 0 0; font-size: 15px; line-height: 1.4; }
  .btns { display: flex; gap: 10px; margin-top: 18px; }
  .btns button { flex: 1; height: 46px; border-radius: 10px; font: 600 14.5px Pretendard, sans-serif; cursor: pointer; }
  .b1 { background: #1f5eff; color: #fff; border: 0; }
  .b2 { background: #fff; color: #1a1d23; border: 1px solid #d9dce2; }
  .toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); background: #1a1d23; color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 13.5px; opacity: 0; transition: opacity .2s; }
</style>
</head>
<body>
<div class="top"><b>우편번호 찾기</b><span>도로명·건물명·지번으로 찾아보세요</span></div>
<div id="wrap"></div>
<div id="res">
  <div class="zip">우편번호<strong id="zip"></strong></div>
  <div class="addr"><div>도로명 주소</div><p id="road"></p></div>
  <div class="addr"><div>지번 주소</div><p id="jibun"></p></div>
  <div class="btns">
    <button class="b1" onclick="copy(document.getElementById('zip').textContent)">우편번호 복사</button>
    <button class="b2" onclick="copy(document.getElementById('zip').textContent + ' ' + document.getElementById('road').textContent)">주소까지 복사</button>
  </div>
  <div class="btns"><button class="b2" onclick="again()">다시 찾기</button></div>
</div>
<div class="toast" id="toast">복사했어요</div>
<script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script>
  function open_() {
    document.getElementById('res').style.display = 'none';
    var w = document.getElementById('wrap');
    w.style.display = 'block';
    w.innerHTML = '';
    new daum.Postcode({
      width: '100%', height: '100%',
      oncomplete: function (d) {
        document.getElementById('zip').textContent = d.zonecode;
        document.getElementById('road').textContent = d.roadAddress + (d.buildingName ? ' (' + d.buildingName + ')' : '');
        document.getElementById('jibun').textContent = d.jibunAddress || d.autoJibunAddress || '-';
        w.style.display = 'none';
        document.getElementById('res').style.display = 'block';
      }
    }).embed(w);
  }
  function again() { open_(); }
  function copy(t) {
    var done = function () { var e = document.getElementById('toast'); e.style.opacity = 1; setTimeout(function () { e.style.opacity = 0; }, 1400); };
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(done, done); else done();
  }
  open_();
</script>
</body>
</html>
